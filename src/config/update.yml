# ============================================================
# 自动更新配置
# ============================================================
# 多渠道更新：同时检查 generic 和 github 渠道
# 优先级：先检查 generic，再检查 github，选择版本号最高的更新
# ============================================================

# ------------------------------------------------------------
# 通用 HTTP 服务器配置
# ------------------------------------------------------------
generic:
  # 服务器上放置构建产物的目录 URL（不含末尾斜杠）
  # electron-updater 会自动在此 URL 后追加 /latest.yml 读取版本元数据
  url: "https://talktime.oss-cn-shanghai.aliyuncs.com/doc/bl/bl"

# ------------------------------------------------------------
# GitHub Releases 配置
# ------------------------------------------------------------
# 前置条件：
#   1. 在 GitHub 上创建 Personal Access Token (经典令牌)
#      访问: https://github.com/settings/tokens
#      权限: repo (全部) 或 public_repo (公开仓库)
# ------------------------------------------------------------
github:
  owner: zuorn
  repo: bilibili-client

# ------------------------------------------------------------
# 启动时自动检查更新（推荐开启）
# ------------------------------------------------------------
autoCheck: true

# ------------------------------------------------------------
# 自动下载更新包
# false — 发现新版本后显示更新按钮，用户点击才下载
# true  — 发现新版本后立即静默下载
# ------------------------------------------------------------
autoDownload: true