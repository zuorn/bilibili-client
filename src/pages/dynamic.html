<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哔哩哔哩 - 动态</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="logo-btn" id="homeBtn">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" fill="#FB7299"/>
          <circle cx="38" cy="42" r="8" fill="white"/>
          <circle cx="62" cy="42" r="8" fill="white"/>
          <circle cx="38" cy="42" r="4" fill="#FB7299"/>
          <circle cx="62" cy="42" r="4" fill="#FB7299"/>
          <path d="M35 65 Q50 80 65 65" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="header-right">
      <div class="search-box">
        <input type="text" placeholder="搜索你感兴趣的视频" class="search-input">
        <button class="search-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
      </div>
      <div class="window-controls">
        <button class="window-control-btn" id="minBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 12h12"/>
          </svg>
        </button>
        <button class="window-control-btn" id="maxBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </button>
        <button class="window-control-btn close-btn" id="closeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-item" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="sidebar-item" data-page="anime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
          <polyline points="12 18 12 10"/>
          <polyline points="8 14 12 10 16 14"/>
        </svg>
        <span>番剧</span>
      </div>
      <div class="sidebar-item active" data-page="dynamic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span>动态</span>
      </div>
      <div class="sidebar-item" data-page="my" id="myBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6V4m0 2a2 2 0 1 0 0 4m0-4a2 2 0 1 1 0 4m-6 8a2 2 0 1 0 0-4m0 4a2 2 0 1 1 0-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 1 0 0-4m0 4a2 2 0 1 1 0-4m0 4v2m0-6V4"/>
        </svg>
        <span>创作中心</span>
      </div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span>直播中心</span>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7.5 18H4v-3.6L16.5 3.5z"/>
        </svg>
        <span>离线缓存</span>
      </div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
        <span>历史记录</span>
      </div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
        <span>收藏</span>
      </div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2z"/>
          <path d="M19 19v-6a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2z"/>
          <path d="M5 10h14"/>
          <path d="M9 3V1h6v2"/>
        </svg>
        <span>稍后再看</span>
      </div>
    </aside>

    <main class="content">
      <div class="dynamic-container">
        <aside class="dynamic-sidebar">
          <div class="dynamic-sidebar-header">
            <div class="dynamic-all-btn active" id="allDynamicBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 11H5m14 0a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2m14 0V9a2 2 0 0 0-2-2M5 11V9a2 2 0 0 1 2-2m0 0V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2M7 7h10"/>
              </svg>
              <span>全部动态</span>
            </div>
          </div>
          <div class="following-section">
            <div class="following-list" id="followingList">
            </div>
          </div>
        </aside>

        <div class="dynamic-content">
          <div class="video-container" id="videoContainer">
          </div>
          <div class="loading-more" id="loadingMore" style="display: none;">
            <span>加载中...</span>
          </div>
          <div class="no-more" id="noMore" style="display: none;">
            <span>没有更多内容了</span>
          </div>
        </div>
      </div>

      <div class="bottom-actions">
        <button class="bottom-action-btn refresh-btn" id="refreshBtn" title="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
          <span>刷新</span>
        </button>
        <button class="bottom-action-btn backtop-btn" id="backTopBtn" title="回到顶部">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 19V5"/>
            <path d="M5 12l7-7 7 7"/>
          </svg>
          <span>顶部</span>
        </button>
      </div>
    </main>
  </div>

  <script src="../renderer/dynamic-renderer.js"></script>
</body>
</html>
