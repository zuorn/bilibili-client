<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哔哩哔哩 - 影视</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="logo-btn" id="homeBtn">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" fill="#FB7299"/>
          <circle cx="38" cy="42" r="8" fill="white"/>
          <circle cx="62" cy="42" r="8" fill="white"/>
          <circle cx="38" cy="42" r="4" fill="#FB7299"/>
          <circle cx="62" cy="42" r="4" fill="#FB7299"/>
          <path d="M35 65 Q50 80 65 65" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="nav-links">
        <a href="#" class="nav-link">推荐</a>
        <a href="#" class="nav-link">热门</a>
        <a href="#" class="nav-link">追番</a>
        <a href="#" class="nav-link">影视</a>
      </div>
    </div>
    <div class="header-right">
      <div class="search-box">
        <input type="text" placeholder="搜索你感兴趣的视频" class="search-input">
        <button class="search-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
      </div>
      <div class="window-controls">
        <button class="window-control-btn" id="minBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 12h12"/>
          </svg>
        </button>
        <button class="window-control-btn" id="maxBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </button>
        <button class="window-control-btn close-btn" id="closeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-item" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="sidebar-item" data-page="popular">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
          <polyline points="12 18 12 10"/>
          <polyline points="8 14 12 10 16 14"/>
        </svg>
        <span>热门</span>
      </div>
      <div class="sidebar-item" data-page="anime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
          <line x1="7" y1="2" x2="7" y2="22"/>
          <line x1="17" y1="2" x2="17" y2="22"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <line x1="2" y1="7" x2="7" y2="7"/>
          <line x1="2" y1="17" x2="7" y2="17"/>
          <line x1="17" y1="17" x2="22" y2="17"/>
          <line x1="17" y1="7" x2="22" y2="7"/>
        </svg>
        <span>追番</span>
      </div>
      <div class="sidebar-item" data-page="media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        <span>影视</span>
      </div>
    </aside>

    <main class="content">
      <div class="page-header">
        <div class="page-tabs">
          <div class="page-tab active" data-season-type="2">电影</div>
          <div class="page-tab" data-season-type="5">电视剧</div>
          <div class="page-tab" data-season-type="7">综艺</div>
        </div>
      </div>
      <div class="media-grid" id="mediaGrid"></div>
    </main>
  </div>

  <script src="../renderer/media-renderer.js"></script>
</body>
</html>
