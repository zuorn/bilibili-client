<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哔哩哔哩 - 我的</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <button class="logo-btn" id="homeBtn">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" fill="#FB7299"/>
          <circle cx="38" cy="42" r="8" fill="white"/>
          <circle cx="62" cy="42" r="8" fill="white"/>
          <circle cx="38" cy="42" r="4" fill="#FB7299"/>
          <circle cx="62" cy="42" r="4" fill="#FB7299"/>
          <path d="M35 65 Q50 80 65 65" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="nav-links">
        <a href="#" class="nav-link">推荐</a>
        <a href="#" class="nav-link">热门</a>
        <a href="#" class="nav-link">追番</a>
        <a href="#" class="nav-link">影视</a>
      </div>
    </div>
    <div class="header-right">
      <div class="search-box">
        <input type="text" placeholder="搜索你感兴趣的视频" class="search-input">
        <button class="search-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
      </div>
      <div class="window-controls">
        <button class="window-control-btn" id="minBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 12h12"/>
          </svg>
        </button>
        <button class="window-control-btn" id="maxBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </button>
        <button class="window-control-btn close-btn" id="closeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-item" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>首页</span>
      </div>
      <div class="sidebar-item" data-page="anime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
          <polyline points="12 18 12 10"/>
          <polyline points="8 14 12 10 16 14"/>
        </svg>
        <span>番剧</span>
      </div>
      <div class="sidebar-item" data-page="dynamic" id="dynamicBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span>动态</span>
      </div>
      <div class="sidebar-item active" data-page="my">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6V4m0 2a2 2 0 1 0 0 4m0-4a2 2 0 1 1 0 4m-6 8a2 2 0 1 0 0-4m0 4a2 2 0 1 1 0-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 1 0 0-4m0 4a2 2 0 1 1 0-4m0 4v2m0-6V4"/>
        </svg>
        <span>创作中心</span>
      </div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span>直播中心</span>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7.5 20.5 2 22l1.5-5.5L17 3.5z"/>
        </svg>
        <span>离线缓存</span>
      </div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
        <span>历史记录</span>
      </div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
        <span>收藏</span>
      </div>
      <div class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2z"/>
          <path d="M19 19v-6a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2z"/>
          <path d="M5 10h14"/>
          <path d="M9 3V1h6v2"/>
        </svg>
        <span>稍后再看</span>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-item" id="devToolsBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>开发者工具</span>
      </div>
    </aside>

    <main class="content">
      <div class="my-page">
        <div class="my-header">
          <div class="my-avatar-container" id="loginArea">
            <div class="my-avatar">
              <svg viewBox="0 0 48 48" fill="none">
                <circle cx="24" cy="24" r="20" fill="#f5f5f5"/>
                <circle cx="24" cy="20" r="8" fill="#e0e0e0"/>
                <circle cx="20" cy="18" r="1.5" fill="#999"/>
                <circle cx="28" cy="18" r="1.5" fill="#999"/>
                <path d="M20 26 Q24 30 28 26" stroke="#999" stroke-width="2" fill="none"/>
              </svg>
            </div>
            <div class="my-user-info">
              <div class="my-login-text">点击登录</div>
              <div class="my-coins">
                <span>B币: -</span>
                <span class="separator">|</span>
                <span>硬币: -</span>
              </div>
            </div>
            <div class="my-edit-btn" style="display: none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </div>
            <button class="logout-btn" id="logoutBtn" style="display: none;">退出登录</button>
          </div>

          <div class="my-stats">
            <div class="my-stat-item">
              <span class="stat-value">0</span>
              <span class="stat-label">动态</span>
            </div>
            <div class="my-stat-item">
              <span class="stat-value">0</span>
              <span class="stat-label">关注</span>
            </div>
            <div class="my-stat-item">
              <span class="stat-value">0</span>
              <span class="stat-label">粉丝</span>
            </div>
            <div class="my-stat-item space-link">
              <span class="stat-value">空间</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="my-tabs-container">
          <div class="my-tabs-wrapper">
            <div class="my-breadcrumb">
              <span class="breadcrumb-item" data-tab="history">历史记录</span>
              <span class="breadcrumb-separator">/</span>
              <span class="breadcrumb-item" data-tab="favorites">我的收藏</span>
            </div>
          </div>
        </div>

        <div class="my-content-wrapper">
          <div class="no-login-area">
            <div class="no-login-icon">
              <svg viewBox="0 0 48 48" fill="none">
                <circle cx="24" cy="24" r="20" fill="#f5f5f5"/>
                <circle cx="24" cy="20" r="8" fill="#e0e0e0"/>
                <circle cx="20" cy="18" r="1.5" fill="#999"/>
                <circle cx="28" cy="18" r="1.5" fill="#999"/>
                <path d="M20 26 Q24 30 28 26" stroke="#999" stroke-width="2" fill="none"/>
              </svg>
            </div>
            <div class="no-login-title">你还未登录</div>
            <div class="no-login-desc">登录注册解锁更多内容</div>
            <button class="login-btn" id="loginBtn">登录</button>
          </div>

          <div class="video-grid" id="videoGrid"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="login-modal" id="loginModal">
    <div class="login-modal-mask"></div>
    <div class="login-modal-content">
      <button type="button" class="login-modal-close" id="loginCloseBtn" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="login-modal-main">
        <div class="login-modal-head">
          <h2 class="login-modal-qr-title">扫描二维码登录</h2>
          <div class="login-form-tabs">
            <button type="button" class="login-form-tab" id="pwdTab">密码登录</button>
            <span class="login-form-tab-sep" aria-hidden="true">|</span>
            <button type="button" class="login-form-tab active" id="smsTab">短信登录</button>
          </div>
        </div>

        <div class="login-modal-body">
          <div class="login-modal-col login-modal-col--qr">
            <div class="qr-code-frame">
              <div class="qr-code" id="qrCode">
                <div class="qr-loading" aria-live="polite">
                  <span class="qr-loading-spinner" aria-hidden="true"></span>
                  <span class="qr-loading-text">加载中</span>
                </div>
              </div>
            </div>
            <p class="login-modal-qr-hint">请使用 <span class="login-accent-text">哔哩哔哩手机端</span> 扫码登录PC客户端</p>
            <div class="qr-status" id="qrStatus"></div>
          </div>

          <div class="login-modal-split" aria-hidden="true"></div>

          <div class="login-modal-col login-modal-col--form">
          <div class="login-form-panel-wrap">
            <div class="pwd-login login-form-panel">
              <div class="login-field-group">
                <div class="login-stack-row">
                  <input type="text" class="login-field-input login-field-input--grow" placeholder="用户名/邮箱/手机号" autocomplete="username">
                </div>
                <div class="login-stack-row">
                  <input type="password" class="login-field-input login-field-input--grow" placeholder="密码" autocomplete="current-password">
                </div>
              </div>
              <button type="button" class="login-submit-btn">登录</button>
            </div>

            <div class="sms-login login-form-panel active">
              <div class="login-field-group">
                <div class="login-stack-row login-stack-row--phone">
                  <div class="login-country-slot">
                    <span class="login-country-code">+86</span>
                    <svg class="login-select-caret" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                      <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </div>
                  <span class="login-inline-split"></span>
                  <input type="tel" class="login-field-input login-field-input--grow" placeholder="请输入手机号" autocomplete="tel">
                  <span class="login-inline-split"></span>
                  <button type="button" class="login-get-code-btn">获取验证码</button>
                </div>
                <div class="login-stack-row login-stack-row--code">
                  <span class="login-code-label">验证码</span>
                  <span class="login-inline-split"></span>
                  <input type="text" class="login-field-input login-field-input--grow" placeholder="请输入验证码" autocomplete="one-time-code">
                </div>
              </div>
              <button type="button" class="login-submit-btn">登录/注册</button>
            </div>
          </div>
          </div>
        </div>
      </div>

      <footer class="login-modal-foot">
        <div class="login-modal-mascots" aria-hidden="true">
          <svg class="login-mascot login-mascot--left" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="55" cy="95" rx="48" ry="28" fill="#7ec8f0"/>
            <circle cx="58" cy="52" r="38" fill="#b8e0ff"/>
            <ellipse cx="42" cy="48" rx="5" ry="7" fill="#2a2a2a"/>
            <ellipse cx="72" cy="48" rx="5" ry="7" fill="#2a2a2a"/>
            <path d="M48 62 Q58 70 68 62" stroke="#6bb3e8" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
          <svg class="login-mascot login-mascot--right" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="65" cy="95" rx="48" ry="28" fill="#d4d4d8"/>
            <circle cx="62" cy="52" r="38" fill="#f0f0f2"/>
            <ellipse cx="46" cy="48" rx="5" ry="7" fill="#2a2a2a"/>
            <ellipse cx="76" cy="48" rx="5" ry="7" fill="#2a2a2a"/>
            <path d="M52 62 Q62 70 72 62" stroke="#c0c0c8" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="login-footer-copy">
          <p>未注册过哔哩哔哩的手机号，我们将自动帮你注册账号</p>
          <p>登录或完成注册即代表你同意 <a href="#" class="login-footer-link">用户协议</a> 和 <a href="#" class="login-footer-link">隐私政策</a></p>
        </div>
      </footer>
    </div>
  </div>

  <script src="../renderer/my-renderer.js"></script>
</body>
</html>
