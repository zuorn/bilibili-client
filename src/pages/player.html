    function setupCommentsObserver() {
      if (commentsObserver) commentsObserver.disconnect()
      const sentinel = document.getElementById('commentsSentinel')
      if (!sentinel) return
      commentsObserver = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting && hasMoreComments && !isLoadingComments) {
          loadComments()
        }
      }, { root: commentsList, rootMargin: '60px' })
      commentsObserver.observe(sentinel)
    }

    async function loadComments() {
      if (isLoadingComments || !hasMoreComments) return
      const oid = currentVideoData?.aid || currentVideoData?.cid
      if (!oid) return

      const isFirstPage = commentsData.length === 0
      isLoadingComments = true
      commentsError = false

      // Show loading indicator
      if (!isFirstPage) {
        const sentinel = document.getElementById('commentsSentinel')
        if (sentinel) {
          sentinel.className = 'loading-more-comments loading'
          sentinel.innerHTML = '<span class="loading-spinner"></span>加载中...'
        }
      }

      try {
        const mode = currentCommentSort === 'hot' ? 3 : 2
        const result = await ipcRenderer.invoke('get-comments', oid, mode, currentPaginationStr)

        if (result.success) {
          const newReplies = result.data.replies || []
          commentsData = commentsData.concat(newReplies)
          const nextOffset = result.data.cursor?.pagination_reply?.next_offset
          currentPaginationStr = nextOffset ? JSON.stringify({ offset: nextOffset }) : ''
          hasMoreComments = !!currentPaginationStr

          const total = result.data.cursor?.all_count ?? result.data.page?.count
          if (total != null) {
            commentCount.textContent = formatNumber(total)
          }

          if (isFirstPage) {
            renderComments()
          } else {
            appendComments(newReplies)
          }
        } else {
          commentsError = true
          if (isFirstPage) {
            commentsList.innerHTML = `<div class="comments-error" onclick="loadComments()">加载失败: ${escapeHtml(result.error || '未知错误')}<br><span style="color:#666">点击重试</span></div>`
          } else {
            const sentinel = document.getElementById('commentsSentinel')
            if (sentinel) {
              sentinel.className = 'loading-more-comments'
              sentinel.textContent = '加载失败，点击重试'
            }
          }
        }
      } catch (error) {
        commentsError = true
        if (isFirstPage) {
          commentsList.innerHTML = `<div class="comments-error" onclick="loadComments()">网络错误<br><span style="color:#666">点击重试</span></div>`
        } else {
          const sentinel = document.getElementById('commentsSentinel')
          if (sentinel) {
            sentinel.className = 'loading-more-comments'
            sentinel.textContent = '加载失败，点击重试'
          }
        }
      } finally {
        isLoadingComments = false
      }
    }

    function renderComments() {
      commentsList.innerHTML = ''

      if (commentsData.length === 0) {
        commentsList.innerHTML = '<div class="comments-empty">暂无评论</div>'
        return
      }

      const fragment = document.createDocumentFragment()
      commentsData.forEach(comment => {
        const el = document.createElement('div')
        el.innerHTML = renderCommentItem(comment)
        fragment.appendChild(el.firstElementChild)
      })

      if (hasMoreComments) {
        const sentinel = document.createElement('div')
        sentinel.className = 'loading-more-comments'
        sentinel.id = 'commentsSentinel'
        sentinel.textContent = '加载更多'
        sentinel.addEventListener('click', loadComments)
        fragment.appendChild(sentinel)
      }

      commentsList.appendChild(fragment)
      if (hasMoreComments) setupCommentsObserver()
    }

    function appendComments(newReplies) {
      // Remove old sentinel
      const oldSentinel = document.getElementById('commentsSentinel')
      if (oldSentinel) oldSentinel.remove()
      if (commentsObserver) commentsObserver.disconnect()

      const fragment = document.createDocumentFragment()
      newReplies.forEach(comment => {
        const el = document.createElement('div')
        el.innerHTML = renderCommentItem(comment)
        fragment.appendChild(el.firstElementChild)
      })

      if (hasMoreComments) {
        const sentinel = document.createElement('div')
        sentinel.className = 'loading-more-comments'
        sentinel.id = 'commentsSentinel'
        sentinel.textContent = '加载更多'
        sentinel.addEventListener('click', loadComments)
        fragment.appendChild(sentinel)
      }

      commentsList.appendChild(fragment)
      if (hasMoreComments) setupCommentsObserver()
    }

    function renderCommentItem(comment) {
      const avatar = comment.member?.avatar || ''
      const userName = comment.member?.uname || '未知用户'
      const userLevel = comment.member?.level_info?.current_level || 0
      const isVip = comment.member?.vip?.vipStatus === 1
      const content = comment.content?.message || ''
      const time = formatCommentTime(comment.ctime)
      const likeCount = comment.like || 0
      const replyCount = comment.count || 0
      
      let badgeHtml = ''
      if (isVip) {
        badgeHtml = '<span class="comment-author-badge">LV</span>'
      }
      
      let repliesHtml = ''
      if (comment.replies && comment.replies.length > 0) {
        repliesHtml = '<div class="comment-replies">'
        comment.replies.slice(0, 2).forEach(reply => {
          repliesHtml += `
            <div class="comment-reply-item">
              <div class="reply-content">
                <span class="reply-author">${escapeHtml(reply.member?.uname || '')}</span>
                ${escapeHtml(reply.content?.message || '')}
              </div>
            </div>
          `
        })
        if (comment.replies.length > 2) {
          repliesHtml += `<div style="padding:4px 0;font-size:11px;color:#666;">还有${comment.replies.length - 2}条回复...</div>`
        }
        repliesHtml += '</div>'
      }
      
      return `
        <div class="comment-item">
          <div class="comment-header">
            <img class="comment-avatar" src="${avatar}" alt="${userName}" loading="lazy" onerror="this.onerror=null;this.style.display='none';this.insertAdjacentHTML('afterend','<span class=comment-avatar-fallback>${escapeHtml(userName.charAt(0))}</span>')">
            <div class="comment-author-info">
              <div class="comment-author-name">${escapeHtml(userName)}${badgeHtml}</div>
              <div class="comment-time">${time}</div>
            </div>
          </div>
          <div class="comment-content">${escapeHtml(content)}</div>
          <div class="comment-actions">
            <button class="comment-action-btn like">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
              </svg>
              <span>${formatNumber(likeCount)}</span>
            </button>
            <button class="comment-action-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              <span>${replyCount}</span>
            </button>
            <button class="comment-action-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
              </svg>
            </button>
          </div>
          ${repliesHtml}
        </div>
      `
    }

    function formatCommentTime(timestamp) {
      const now = Date.now() / 1000
      const diff = now - timestamp
      
      if (diff < 60) return '刚刚'
      if (diff < 3600) return Math.floor(diff / 60) + '分钟前'
      if (diff < 86400) return Math.floor(diff / 3600) + '小时前'
      if (diff < 604800) return Math.floor(diff / 86400) + '天前'
      
      const date = new Date(timestamp * 1000)
      return date.getMonth() + 1 + '月' + date.getDate() + '日'
    }

    function submitComment() {
      const content = commentInput.value.trim()
      if (!content) return
      
      showToast('评论功能开发中')
      commentInput.value = ''
      sendCommentBtn.disabled = true
    }

    async function loadVideoInfo(bvid) {
      try {
        const result = await ipcRenderer.invoke('get-video-info', bvid)
        if (result.success && result.data) {
          populateVideoInfo(result.data, result.related)
        }
      } catch (error) {
        console.log('加载视频信息失败:', error)
      }
    }

    async function loadRelatedVideos(bvid) {
      try {
        const result = await ipcRenderer.invoke('get-related-videos', bvid)
        if (result.success && result.data && result.data.length > 0) {
          renderRelatedVideos(result.data)
        }
      } catch (error) {
        console.log('加载相关视频失败:', error)
      }
    }

    function renderRelatedVideos(videos) {
      panelRelatedList.innerHTML = ''
      videos.forEach(v => {
        const item = document.createElement('div')
        item.className = 'related-video-item'
        const durationMin = Math.floor((v.duration || 0) / 60)
        const durationSec = (v.duration || 0) % 60
        const durationStr = String(durationMin).padStart(2, '0') + ':' + String(durationSec).padStart(2, '0')
        item.innerHTML = `
          <div style="position:relative;flex-shrink:0;">
            <img class="related-video-cover" src="${v.pic || ''}" alt="" loading="lazy">
            <span class="related-video-duration">${durationStr}</span>
          </div>
          <div class="related-video-info">
            <div class="related-video-title">${escapeHtml(v.title || '')}</div>
            <div class="related-video-author">${escapeHtml(v.owner?.name || '')}</div>
            <div class="related-video-stats">
              <span>${formatNumber(v.stat?.view || 0)}播放</span>
              <span>${formatNumber(v.stat?.danmaku || 0)}弹幕</span>
            </div>
          </div>
        `
        item.addEventListener('click', () => {
          switchToVideo(v.bvid, v.cid, v.title)
        })
        panelRelatedList.appendChild(item)
      })
    }

    const escapeHtml = (() => {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }
      const re = /[&<>"']/g
      return text => text.replace(re, c => map[c])
    })()
    window.escapeHtml = escapeHtml

    async function loadDanmaku(cid) {
      try {
        const result = await ipcRenderer.invoke('get-danmaku', cid)
        if (result.success) {
          danmakuList = parseDanmaku(result.data)
          startDanmaku()
        }
      } catch (error) {
        console.log('加载弹幕失败:', error)
      }
    }

    function parseDanmaku(xmlText) {
      const parser = new DOMParser()
      const doc = parser.parseFromString(xmlText, 'text/xml')
      const items = doc.querySelectorAll('d')
      const result = []
      
      items.forEach(item => {
        const p = item.getAttribute('p').split(',')
        result.push({
          time: parseFloat(p[0]),
          type: parseInt(p[1]),
          color: p[3],
          text: item.textContent
        })
      })
      
      return result.sort((a, b) => a.time - b.time)
    }

    function startDanmaku() {
      if (danmakuTimer) clearInterval(danmakuTimer)
      danmakuIndex = 0

      danmakuTimer = setInterval(() => {
        if (!danmakuEnabled || !videoPlayer.currentTime) return

        while (danmakuIndex < danmakuList.length && 
               danmakuList[danmakuIndex].time <= videoPlayer.currentTime + 1) {
          showDanmaku(danmakuList[danmakuIndex])
          danmakuIndex++
        }
      }, 100)
    }

    function showDanmaku(danmaku) {
      const item = document.createElement('div')
      item.className = 'danmaku-item'
      item.textContent = danmaku.text
      
      if (danmaku.color !== '16777215') {
        item.style.color = `#${parseInt(danmaku.color).toString(16).padStart(6, '0')}`
      }
      
      const top = Math.random() * 90 + 2
      item.style.top = `${top}%`
      item.style.animationDuration = `${10 + Math.random() * 5}s`
      
      danmakuContainer.appendChild(item)
      
      setTimeout(() => {
        item.remove()
      }, 15000)
    }

    function formatNumber(num) {
      if (num >= 10000) {
        return (num / 10000).toFixed(1) + '万'
      }
      return num.toString()
    }

    function showError(title, message) {
      loadingOverlay.style.display = 'none'
      errorTitle.textContent = title
      errorMessage.textContent = message
      errorOverlay.style.display = 'flex'
    }

    retryBtn.addEventListener('click', () => {
      if (currentVideoData) {
        loadVideo(currentVideoData.bvid, currentVideoData.cid)
      }
    })

    playPauseBtn.addEventListener('click', () => {
      if (videoPlayer.paused) {
        videoPlayer.play()
        playPauseBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
      } else {
        videoPlayer.pause()
        playPauseBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`
      }
    })

    videoPlayer.addEventListener('play', () => {
      playPauseBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
    })

    videoPlayer.addEventListener('pause', () => {
      playPauseBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`
    })

    // 阻止点击视频区域切换播放暂停
    videoPlayer.addEventListener('click', (e) => {
      e.preventDefault()
    })

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect()
      const percent = (e.clientX - rect.left) / rect.width
      videoPlayer.currentTime = percent * videoPlayer.duration
    })

    let timeUpdatePending = false
    let lastAudioSync = 0
    videoPlayer.addEventListener('timeupdate', () => {
      if (timeUpdatePending) return
      timeUpdatePending = true
      requestAnimationFrame(() => {
        timeUpdatePending = false
        const current = videoPlayer.currentTime
        const duration = videoPlayer.duration
        if (!duration) return

        const percent = current / duration
        progressFill.style.width = `${percent * 100}%`

        const buffered = videoPlayer.buffered
        if (buffered.length > 0) {
          const bufferedEnd = buffered.end(buffered.length - 1)
          progressBuffered.style.width = `${(bufferedEnd / duration) * 100}%`
        }

        timeDisplay.textContent = formatTime(current) + ' / ' + formatTime(duration)

        // Periodic DASH audio re-sync to prevent clock drift on long videos
        if (currentAudioElement && !videoPlayer.paused && !videoPlayer.seeking
            && current - lastAudioSync > 5) {
          const drift = Math.abs(current - currentAudioElement.currentTime)
          if (drift > 0.1) {
            currentAudioElement.currentTime = current
          }
          lastAudioSync = current
        }
      })
    })

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60)
      const secs = Math.floor(seconds % 60)
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`
    }

    volumeBar.addEventListener('click', (e) => {
      const rect = volumeBar.getBoundingClientRect()
      const percent = (e.clientX - rect.left) / rect.width
      videoPlayer.volume = percent
      volumeFill.style.width = `${percent * 100}%`
      saveVolume(percent)
    })

    muteBtn.addEventListener('click', () => {
      videoPlayer.muted = !videoPlayer.muted
      if (videoPlayer.muted) {
        muteBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`
        videoPlayer.volume = 0
        updateVolumeDisplay()
      } else {
        muteBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`
        const savedVol = localStorage.getItem('playerVolume')
        videoPlayer.volume = savedVol !== null ? parseFloat(savedVol) : 0.8
        updateVolumeDisplay()
      }
    })

    let hideVolumePanelTimer = null

    const updateVolumeDisplay = () => {
      const volume = videoPlayer.volume
      const percentage = Math.round(volume * 100)
      
      volumeFill.style.width = `${percentage}%`
      volumeSliderFill.style.height = `${percentage}%`
      volumeIcon.textContent = percentage === 0 ? '🔇' : '🔊'
    }

    const showVolumePanel = () => {
      volumePanel.classList.add('visible')
      updateVolumeDisplay()
      
      if (hideVolumePanelTimer) {
        clearTimeout(hideVolumePanelTimer)
      }
      
      hideVolumePanelTimer = setTimeout(() => {
        volumePanel.classList.remove('visible')
      }, 2000)
    }

    const updateVerticalVolumeDisplay = updateVolumeDisplay
    const showVerticalVolumeBar = showVolumePanel

    const volumeSlider = document.getElementById('volumeSlider')
    volumeSlider.addEventListener('click', (e) => {
      const rect = volumeSlider.getBoundingClientRect()
      const percent = 1 - (e.clientY - rect.top) / rect.height
      const volume = Math.max(0, Math.min(1, percent))
      videoPlayer.volume = volume
      updateVolumeDisplay()
      saveVolume(volume)
    })

    document.querySelectorAll('.speed-option').forEach(option => {
      option.addEventListener('click', (e) => {
        e.stopPropagation()
        const speed = parseFloat(option.dataset.speed)
        videoPlayer.playbackRate = speed
        speedBtn.textContent = speed + 'x'
        document.querySelectorAll('.speed-option').forEach(opt => opt.classList.remove('active'))
        option.classList.add('active')
      })
    })

    danmakuToggleBtn.addEventListener('click', () => {
      danmakuEnabled = !danmakuEnabled
      localStorage.setItem('showDanmaku', danmakuEnabled.toString())
      const danmakuStatus = document.getElementById('danmakuStatus')
      if (danmakuEnabled) {
        danmakuStatus.textContent = '开'
        danmakuStatus.classList.remove('off')
        danmakuStatus.classList.add('on')
        if (currentVideoData?.cid) {
          loadDanmaku(currentVideoData.cid)
        }
      } else {
        danmakuStatus.textContent = '关'
        danmakuStatus.classList.remove('on')
        danmakuStatus.classList.add('off')
        if (danmakuTimer) clearInterval(danmakuTimer)
        danmakuContainer.innerHTML = ''
      }
    })

    fullscreenBtn.addEventListener('click', () => {
      ipcRenderer.invoke('toggle-fullscreen')
    })

    ipcRenderer.on('fullscreen-changed', (event, isFullscreen) => {
      const videoPlayer = document.getElementById('videoPlayer')
      const canvas = document.getElementById('anime4kCanvas')
      if (isFullscreen) {
        videoPlayer.classList.add('fullscreen-mode')
        if (canvas) canvas.classList.add('fullscreen-mode')
      } else {
        videoPlayer.classList.remove('fullscreen-mode')
        if (canvas) canvas.classList.remove('fullscreen-mode')
      }
    })
  </script>
</body>
</html>
