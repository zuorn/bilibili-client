<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哔哩哔哩播放器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw !important;
      height: 100vh !important;
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0 !important;
      padding: 0 !important;
      cursor: default;
      transition: cursor 0.3s ease;
    }

    html.hide-cursor,
    html.hide-cursor body {
      cursor: none;
    }

    .player-container {
      width: 100vw !important;
      height: 100vh !important;
      display: flex;
      flex-direction: column;
      background-color: #000;
      position: relative;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden;
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0));
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      transform: translateY(-100%);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    .header-right {
      -webkit-app-region: no-drag;
    }

    .player-header.visible {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .header-left {
      display: flex;
      align-items: center;
      flex: 1;
    }

    .header-middle {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: flex-end;
    }

    .window-control-btn {
      -webkit-app-region: no-drag;
    }

    .player-controls.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .control-btn {
      -webkit-app-region: no-drag;
    }

    .action-btn {
      -webkit-app-region: no-drag;
    }

    .progress-bar {
      -webkit-app-region: no-drag;
    }

    .volume-bar {
      -webkit-app-region: no-drag;
    }

    .player-title {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      margin-left: 12px;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .window-control-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .window-control-btn:hover {
      background-color: rgba(255,255,255,0.2);
      color: #fff;
    }

    .window-control-btn.close-btn:hover {
      background-color: #e53935;
      color: #fff;
    }

    .context-menu {
      position: fixed;
      background: rgba(30, 30, 30, 0.65);
      border-radius: 8px;
      padding: 4px 0;
      min-width: 220px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: none;
      overflow: hidden;
      -webkit-app-region: no-drag;
      user-select: none;
      -webkit-user-select: none;
    }

    .context-menu.show {
      display: block;
    }

    .context-menu-item {
      padding: 10px 16px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .context-menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .context-menu-item:active {
      background: rgba(255, 255, 255, 0.15);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeOutDown {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(20px);
      }
    }

    @keyframes toastFadeInUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @keyframes toastFadeOutDown {
      from {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      to {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }
    }

    .video-area {
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .video-area, .video-area * {
      -webkit-app-region: no-drag;
    }
    
    .drag-region {
      display: none;
    }

    .video-player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      background-color: #000;
      user-select: none;
      -webkit-user-drag: none;
      z-index: 0;
    }

    .video-player.anime4k-active {
      opacity: 0;
      pointer-events: none;
    }

    .video-player.fullscreen-mode {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
    }

    .anime4k-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      background-color: #000;
      z-index: 1;
    }

    .anime4k-canvas.fullscreen-mode {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
    }

    .video-player.with-panel {
      width: 100vw;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .danmaku-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }

    .danmaku-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      background: transparent;
      border-radius: 20px;
      transition: all 0.3s ease;
      width: auto;
    }

    .danmaku-control:hover {
      transform: scale(1.02);
      background-color: rgba(255,255,255,0.1);
      padding: 6px 16px;
    }

    .danmaku-icon {
      width: 16px;
      height: 16px;
    }

    .danmaku-label {
      font-size: 13px;
      font-weight: 500;
      color: #fff;
    }

    .danmaku-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      min-width: 24px;
      text-align: center;
    }

    .danmaku-status.on {
      background: linear-gradient(135deg, #00a1d6, #00c853);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 161, 214, 0.4);
    }

    .danmaku-status.off {
      background: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.6);
    }

    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 16px;
      color: #fff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      animation: danmaku-scroll linear forwards;
    }

    @keyframes danmaku-scroll {
      from {
        transform: translateX(100vw);
      }
      to {
        transform: translateX(-100%);
      }
    }

    .player-controls {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.3), rgba(0,0,0,0));
      gap: 12px;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 100;
      -webkit-app-region: no-drag;
    }

    .control-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: #ccc;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background-color: rgba(255,255,255,0.1);
      color: #fff;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background-color: #333;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: #00a1d6;
      border-radius: 2px;
      transition: width 0.1s;
    }

    .progress-buffered {
      height: 100%;
      background-color: rgba(255,255,255,0.2);
      border-radius: 2px;
      position: absolute;
      top: 0;
      left: 0;
    }

    .progress-thumb {
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: #00a1d6;
      border-radius: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .progress-bar:hover .progress-thumb {
      opacity: 1;
    }

    .time-display {
      font-size: 12px;
      color: #fff;
      min-width: 80px;
      text-align: center;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100px;
    }

    .volume-bar {
      flex: 1;
      height: 4px;
      background-color: #333;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .volume-fill {
      height: 100%;
      background-color: #00a1d6;
      border-radius: 2px;
    }

    .volume-panel {
      position: fixed;
      left: 20px;
      top: 70px;
      width: 60px;
      height: 140px;
      background: rgba(20, 20, 20, 0.9);
      border-radius: 12px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .volume-panel.visible {
      opacity: 1;
      visibility: visible;
    }

    .volume-icon {
      color: #fff;
      font-size: 18px;
      margin-top: 8px;
      text-align: center;
    }

    .volume-slider-container {
      width: 24px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 0;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .volume-slider-fill {
      width: 100%;
      background: linear-gradient(to top, #00a1d6, #00b5e5);
      border-radius: 0;
      position: absolute;
      bottom: 0;
      transition: height 0.1s ease;
    }

    .volume-value {
      color: #00a1d6;
      font-size: 14px;
      font-weight: 600;
      margin-top: 8px;
    }

    .video-info-panel {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 360px;
      background: rgba(20, 20, 20, 0.92);
      backdrop-filter: blur(20px);
      color: #fff;
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 50;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    .video-info-panel::-webkit-scrollbar {
      width: 4px;
    }

    .video-info-panel::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
    }

    .video-info-panel.visible {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .video-info-panel *:focus,
    .video-info-panel *:focus-visible {
      outline: none !important;
    }

    .panel-toggle-btn {
      position: fixed;
      top: 50%;
      right: 0;
      width: 32px;
      height: 64px;
      background: rgba(0, 0, 0, 0.6);
      border: 0;
      border-radius: 8px 0 0 8px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 51;
      -webkit-app-region: no-drag;
      opacity: 0;
      pointer-events: none;
      outline: none;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
      transform: translateY(-50%) translateX(0);
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
    }

    .panel-toggle-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .panel-toggle-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .panel-toggle-btn.visible.expand {
      transform: translateY(-50%) translateX(0);
    }

    .panel-toggle-btn.visible.collapse {
      transform: translateY(-50%) translateX(-360px);
    }

    .panel-toggle-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 3;
      transition: transform 0.3s ease;
    }

    .panel-toggle-btn.collapse svg {
      transform: rotate(180deg);
    }

    /* Panel tabs */
    .panel-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 16px;
    }

    .panel-tab {
      padding: 12px 16px;
      font-size: 14px;
      color: #999;
      cursor: pointer;
      text-align: center;
      position: relative;
      transition: color 0.2s;
    }

    .panel-tab:hover {
      color: #fff;
    }

    .panel-tab.active {
      color: #00a1d6;
    }

    .panel-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 2px;
      background: #00a1d6;
      border-radius: 1px;
    }

    .panel-tab-count {
      font-size: 12px;
      margin-left: 4px;
      color: #666;
    }

    .panel-tab.active .panel-tab-count {
      color: #00a1d6;
    }

    /* Panel inner content area */
    .panel-inner {
      padding: 0;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .panel-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      overflow-y: auto;
    }

    .panel-content::-webkit-scrollbar {
      width: 4px;
    }

    .panel-content::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
    }

    /* Title */
    .video-info-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }

    /* Stats row */
    .video-info-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #999;
      flex-wrap: wrap;
    }

    .stat-sep {
      width: 1px;
      height: 10px;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    /* Author section */
    .video-info-author {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .author-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #333;
      cursor: pointer;
      flex-shrink: 0;
      object-fit: cover;
    }

    .author-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .author-name {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .author-name:hover {
      color: #00a1d6;
    }

    .author-fans {
      font-size: 11px;
      color: #999;
    }

    .follow-btn {
      background: rgba(0, 161, 214, 0.15);
      border: 1px solid #00a1d6;
      color: #00a1d6;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .follow-btn:hover {
      background: #00a1d6;
      color: #fff;
    }

    .follow-btn.followed {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      color: #999;
    }

    /* Action buttons */
    .video-info-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 6px;
      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 8px;
      color: #ccc;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-count {
      font-size: 12px;
      font-weight: 500;
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
    }

    .action-btn.like:hover {
      color: #fb7299;
    }

    .action-btn.like.liked {
      color: #fb7299;
    }

    .action-btn.collect:hover {
      color: #ff9f1c;
    }

    .action-btn.share:hover {
      color: #00a1d6;
    }

    .action-btn.coin:hover {
      color: #f2d600;
    }

    /* Description */
    .panel-desc {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 12px;
    }

    .panel-desc-text {
      font-size: 12px;
      color: #999;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .panel-desc-text.expanded {
      display: block;
    }

    .panel-desc-toggle {
      background: none;
      border: none;
      color: #00a1d6;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 0 0;
      display: block;
    }

    .panel-desc-toggle:hover {
      color: #00b5e5;
    }

    /* Tags */
    .panel-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .panel-tag {
      background: rgba(255,255,255,0.08);
      color: #aaa;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .panel-tag:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    /* Related videos section */
    .panel-related {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 12px;
    }

    .panel-related-title {
      font-size: 13px;
      color: #ccc;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .panel-related-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .related-video-item {
      display: flex;
      gap: 10px;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .related-video-item:hover {
      background: rgba(255,255,255,0.06);
    }

    .related-video-cover {
      width: 120px;
      height: 68px;
      border-radius: 4px;
      background: #222;
      flex-shrink: 0;
      object-fit: cover;
      position: relative;
    }

    .related-video-duration {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 2px;
    }

    .related-video-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .related-video-title {
      font-size: 12px;
      color: #ddd;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .related-video-author {
      font-size: 11px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .related-video-stats {
      font-size: 11px;
      color: #888;
      display: flex;
      gap: 8px;
    }

    /* Back to top button */
    .panel-backtop-btn {
      position: sticky;
      bottom: 12px;
      align-self: flex-end;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: none;
      color: #ccc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;

  <script src="anime4k.js"></script>
  <script>
    const { ipcRenderer } = require('electron')
    
    const videoPlayer = document.getElementById('videoPlayer')
    const videoTitle = document.getElementById('videoTitle')
    const infoTitle = document.getElementById('infoTitle')
    const authorAvatar = document.getElementById('authorAvatar')
    const authorAvatarHeader = document.getElementById('authorAvatarHeader')
    const authorName = document.getElementById('authorName')
    const authorFans = document.getElementById('authorFans')
    const panelFollowBtn = document.getElementById('panelFollowBtn')
    const publishDate = document.getElementById('publishDate')
    const viewCount = document.getElementById('viewCount')
    const danmakuCount = document.getElementById('danmakuCount')
    const likeCount = document.getElementById('likeCount')
    const likeBtn = document.getElementById('likeBtn')
    const coinCount = document.getElementById('coinCount')
    const collectCount = document.getElementById('collectCount')
    const shareCount = document.getElementById('shareCount')
    const panelDesc = document.getElementById('panelDesc')
    const panelDescText = document.getElementById('panelDescText')
    const panelDescToggle = document.getElementById('panelDescToggle')
    const panelRelatedList = document.getElementById('panelRelatedList')
    const panelSeason = document.getElementById('panelSeason')
    const panelBackTopBtn = document.getElementById('panelBackTopBtn')
    const panelTags = document.getElementById('panelTags')
    const playPauseBtn = document.getElementById('playPauseBtn')
    const progressBar = document.getElementById('progressBar')
    const progressFill = document.getElementById('progressFill')
    const progressBuffered = document.getElementById('progressBuffered')
    const timeDisplay = document.getElementById('timeDisplay')
    const volumeBar = document.getElementById('volumeBar')
    const volumeFill = document.getElementById('volumeFill')
    const volumePanel = document.getElementById('volumePanel')
    const volumeSliderFill = document.getElementById('volumeSliderFill')
    const volumeIcon = document.getElementById('volumeIcon')
    const muteBtn = document.getElementById('muteBtn')
    const speedBtn = document.getElementById('speedBtn')
    const danmakuToggleBtn = document.getElementById('danmakuToggleBtn')
    const fullscreenBtn = document.getElementById('fullscreenBtn')
    const loadingOverlay = document.getElementById('loadingOverlay')
    const errorOverlay = document.getElementById('errorOverlay')
    const errorTitle = document.getElementById('errorTitle')
    const errorMessage = document.getElementById('errorMessage')
    const retryBtn = document.getElementById('retryBtn')
    const danmakuContainer = document.getElementById('danmakuContainer')
    const panelToggleBtn = document.getElementById('panelToggleBtn')
    const panelContent = document.getElementById('panelContent')
    const panelComments = document.getElementById('panelComments')
    const panelTabDesc = document.getElementById('panelTabDesc')
    const panelTabComment = document.getElementById('panelTabComment')
    const commentCount = document.getElementById('commentCount')
    const commentsList = document.getElementById('commentsList')
    const commentsLoading = document.getElementById('commentsLoading')
    const commentsSortHot = document.getElementById('commentsSortHot')
    const commentsSortNew = document.getElementById('commentsSortNew')
    const commentInput = document.getElementById('commentInput')
    const sendCommentBtn = document.getElementById('sendCommentBtn')
    
    const minBtn = document.getElementById('minBtn')
    const maxBtn = document.getElementById('maxBtn')
    const closeBtn = document.getElementById('closeBtn')

    let currentVideoData = null
    let currentEpisodeData = null
    let currentAudioElement = null
    let pendingPrefetchData = null
    let loadVideoTimeout = null
    let currentOwnerMid = null
    let isLiked = false

    // Comments related state
    let currentCommentSort = 'hot'
    let currentPaginationStr = '{"offset":""}'
    let commentsData = []
    let isLoadingComments = false
    let hasMoreComments = true

    // Named DASH audio sync handlers so we can remove them before re-adding
    const dashSyncHandlers = {
      onPlay: () => {
        if (currentAudioElement && currentAudioElement.paused) {
          currentAudioElement.play().catch(e => console.log('Audio play error:', e))
        }
      },
      onPause: () => {
        if (currentAudioElement && !currentAudioElement.paused) {
          currentAudioElement.pause()
        }
      },
      onVolumeChange: () => {
        if (currentAudioElement) {
          currentAudioElement.volume = videoPlayer.volume
        }
      },
      onSeeked: () => {
        if (currentAudioElement) {
          currentAudioElement.currentTime = videoPlayer.currentTime
        }
      }
    }

    // DASH 音画同步定时器，防止长时间播放后音画漂移
    let dashSyncTimer = null
    const startDashSyncTimer = () => {
      stopDashSyncTimer()
      dashSyncTimer = setInterval(() => {
        if (currentAudioElement && !videoPlayer.paused && videoPlayer.currentTime > 0) {
          const timeDiff = Math.abs(currentAudioElement.currentTime - videoPlayer.currentTime)
          if (timeDiff > 0.5) {
            console.log(`[DASH同步] 音画偏差${timeDiff.toFixed(2)}秒，修正`)
            currentAudioElement.currentTime = videoPlayer.currentTime
          }
        }
      }, 5000)
    }
    const stopDashSyncTimer = () => {
      if (dashSyncTimer) {
        clearInterval(dashSyncTimer)
        dashSyncTimer = null
      }
    }

    let danmakuEnabled = localStorage.getItem('showDanmaku') !== 'false'
    let danmakuList = []
    let danmakuIndex = 0
    let danmakuTimer = null

    // 初始化弹幕按钮状态
    const initDanmakuStatus = () => {
      const danmakuStatus = document.getElementById('danmakuStatus')
      if (danmakuEnabled) {
        danmakuStatus.textContent = '开'
        danmakuStatus.classList.remove('off')
        danmakuStatus.classList.add('on')
      } else {
        danmakuStatus.textContent = '关'
        danmakuStatus.classList.remove('on')
        danmakuStatus.classList.add('off')
      }
    }
    initDanmakuStatus()

    // 初始化音量
    const savedVolume = localStorage.getItem('playerVolume')
    if (savedVolume !== null) {
      videoPlayer.volume = parseFloat(savedVolume)
    } else {
      videoPlayer.volume = 0.8
    }

    // 保存音量到 localStorage
    const saveVolume = (volume) => {
      localStorage.setItem('playerVolume', volume.toString())
    }

    minBtn.addEventListener('click', () => ipcRenderer.invoke('minimize-player-window'))
    maxBtn.addEventListener('click', () => ipcRenderer.invoke('maximize-player-window'))

    // 安全关闭：先上报最终播放进度，等待完成后关闭窗口
    async function safeClosePlayer() {
      const finalProgress = Math.floor(videoPlayer.currentTime)
      try {
        await ipcRenderer.invoke('report-final-progress', finalProgress)
      } catch (e) {
        console.error('上报最终进度失败:', e)
      }
      window.close()
    }

    closeBtn.addEventListener('click', safeClosePlayer)

    // 捕获窗口关闭事件（Alt+F4、任务栏关闭等），确保进度已上报
    // 在 beforeunload 中使用 send（非阻塞），由主进程在 closed 事件中完成上报
    window.addEventListener('beforeunload', () => {
      const finalProgress = Math.floor(videoPlayer.currentTime)
      try {
        ipcRenderer.send('beforeunload-progress', finalProgress)
      } catch (e) {}
    })

    // 定时上报播放进度（每15秒），确保意外崩溃时也能保留最近进度
    let progressReportTimer = null
    const startProgressReportTimer = () => {
      stopProgressReportTimer()
      progressReportTimer = setInterval(() => {
        if (!videoPlayer.paused && videoPlayer.currentTime > 0) {
          const currentProgress = Math.floor(videoPlayer.currentTime)
          ipcRenderer.invoke('report-play-progress', currentProgress).catch(() => {})
        }
      }, 15000)
    }
    const stopProgressReportTimer = () => {
      if (progressReportTimer) {
        clearInterval(progressReportTimer)
        progressReportTimer = null
      }
    }

    // 右键菜单逻辑
    const contextMenu = document.getElementById('contextMenu')
    const menuCopyUrl = document.getElementById('menuCopyUrl')
    const menuDownload = document.getElementById('menuDownload')
    const menuAnime4K = document.getElementById('menuAnime4K')
    const menuAudioAdjust = document.getElementById('menuAudioAdjust')
    const menuShortcuts = document.getElementById('menuShortcuts')
    const menuVideoStats = document.getElementById('menuVideoStats')

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault()
      const x = e.clientX
      const y = e.clientY
      
      contextMenu.style.left = `${x}px`
      contextMenu.style.top = `${y}px`
      contextMenu.classList.add('show')
    })

    document.addEventListener('click', (e) => {
      // 忽略右键点击，避免右键本身立即关闭上下文菜单
      if (e.button === 2) return
      contextMenu.classList.remove('show')
    })

    contextMenu.addEventListener('click', (e) => {
      e.stopPropagation()
    })

    contextMenu.addEventListener('contextmenu', (e) => {
      e.stopPropagation()
    })

    // 手动窗口拖拽（视频区域左键拖拽移动窗口）
    const videoArea = document.querySelector('.video-area')
    let isDragging = false
    let dragStartScreen = null
    let dragBounds = null

    videoArea.addEventListener('mousedown', async (e) => {
      if (e.button !== 0) return
      const ignore = e.target.closest('.player-controls, .video-info-panel, .episode-section, .episode-item, .window-control-btn, .speed-selector, .speed-option, .action-btn, .control-btn, .context-menu, .video-overlay, .danmaku-container, .progress-bar, .volume-bar, .volume-control, .playback-speed, .time-display')
      if (ignore) return

      e.preventDefault()
      const bounds = await ipcRenderer.invoke('get-window-bounds')
      if (!bounds) return

      isDragging = true
      dragStartScreen = { x: e.screenX, y: e.screenY }
      dragBounds = { x: bounds.x, y: bounds.y, width: bounds.width, height: bounds.height }
    })

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return
      const dx = e.screenX - dragStartScreen.x
      const dy = e.screenY - dragStartScreen.y
      ipcRenderer.send('move-window-bounds', dragBounds.x + dx, dragBounds.y + dy, dragBounds.width, dragBounds.height)
    })

    document.addEventListener('mouseup', () => {
      isDragging = false
      dragStartScreen = null
      dragBounds = null
    })

    // 双击视频区域切换全屏
    videoArea.addEventListener('dblclick', (e) => {
      const ignore = e.target.closest('.player-controls, .video-info-panel, .episode-section, .episode-item, .window-control-btn, .speed-selector, .speed-option, .action-btn, .control-btn, .context-menu, .video-overlay, .danmaku-container, .progress-bar, .volume-bar, .volume-control, .playback-speed, .time-display')
      if (ignore) return
      ipcRenderer.invoke('toggle-fullscreen')
    })

    menuCopyUrl.addEventListener('click', () => {
      if (currentVideoData?.bvid) {
        const url = `https://www.bilibili.com/video/${currentVideoData.bvid}`
        navigator.clipboard.writeText(url).then(() => {
          showToast('已复制视频地址')
        })
      }
      contextMenu.classList.remove('show')
    })

    menuDownload.addEventListener('click', () => {
      contextMenu.classList.remove('show')
      startDownload()
    })

    // 点击标题栏头像和侧边栏头像跳转至UP主页面
    authorAvatarHeader.addEventListener('click', () => {
      if (currentOwnerMid) {
        ipcRenderer.send('open-up-profile', currentOwnerMid)
      }
    })
    authorAvatarHeader.style.cursor = 'pointer'

    authorAvatar.addEventListener('click', () => {
      if (currentOwnerMid) {
        ipcRenderer.send('open-up-profile', currentOwnerMid)
      }
    })
    authorAvatar.style.cursor = 'pointer'

    // 下载视频
    let downloadToastEl = null
    function showDownloadToast(msg, isProgress) {
      if (!downloadToastEl) {
        downloadToastEl = document.createElement('div')
        downloadToastEl.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:14px 24px;border-radius:8px;font-size:14px;z-index:10000;min-width:240px;text-align:center;'
        document.body.appendChild(downloadToastEl)
      }
      downloadToastEl.textContent = msg
      downloadToastEl.style.display = 'block'
      if (!isProgress) {
        setTimeout(function() {
          if (downloadToastEl) downloadToastEl.style.display = 'none'
        }, 3000)
      }
    }
    function hideDownloadToast() {
      if (downloadToastEl) downloadToastEl.style.display = 'none'
    }

    async function startDownload() {
      if (!currentVideoData?.bvid || !currentVideoData?.cid) {
        showToast('无法获取视频信息')
        return
      }
      showDownloadToast('正在获取最高画质下载地址...', true)
      try {
        var result = await ipcRenderer.invoke('download-video', currentVideoData.bvid, currentVideoData.cid, currentVideoData.title)
        if (result.success) {
          showDownloadToast('下载完成: ' + (result.fileName || ''))
        } else if (result.cancelled) {
          hideDownloadToast()
        } else {
          showDownloadToast('下载失败: ' + (result.error || '未知错误'))
        }
      } catch (e) {
        showDownloadToast('下载失败: ' + e.message)
      }
    }

    // 监听下载进度
    ipcRenderer.on('download-progress', function(event, data) {
      var pct = data.percent != null ? data.percent.toFixed(0) + '%' : ''
      var msg = data.step === 'video' ? '正在下载视频 ' + pct :
                data.step === 'audio' ? '正在下载音频 ' + pct :
                data.step === 'merge' ? '正在合并音视频...' : data.step
      showDownloadToast(msg, true)
    })

    menuShortcuts.addEventListener('click', () => {
      showShortcutsDialog()
      contextMenu.classList.remove('show')
    })

    // Anime4K 渲染器初始化
    const anime4kCanvas = document.getElementById('anime4kCanvas')
    let anime4kRenderer = null
    let anime4kEnabled = localStorage.getItem('anime4kEnabled') === 'true'

    if (typeof Anime4KRenderer === 'undefined') {
      console.error('[Anime4K] Module not loaded')
    } else if (!Anime4KRenderer.Renderer) {
      console.error('[Anime4K] Renderer class missing')
    } else {
      anime4kRenderer = new Anime4KRenderer.Renderer(anime4kCanvas, videoPlayer)
      console.log('[Anime4K] Renderer created, ready:', anime4kRenderer.ready, 'gl:', !!anime4kRenderer.gl)

      if (!anime4kRenderer.gl) {
        console.error('[Anime4K] WebGL context creation failed — GPU may be unavailable')
      } else if (!anime4kRenderer.ready) {
        console.error('[Anime4K] Shader compilation failed')
      }

      if (anime4kEnabled && anime4kRenderer.ready) {
        anime4kRenderer.start()
        videoPlayer.classList.add('anime4k-active')
      } else {
        anime4kCanvas.style.display = 'none'
      }
    }

    const updateAnime4KMenu = () => {
      menuAnime4K.textContent = anime4kEnabled ? 'Anime4K 画质增强 ✓' : 'Anime4K 画质增强'
    }
    updateAnime4KMenu()

    menuAnime4K.addEventListener('click', () => {
      contextMenu.classList.remove('show')
      if (!anime4kRenderer) {
        showToast('Anime4K 模块加载失败')
        return
      }
      if (!anime4kRenderer.gl) {
        showToast('WebGL 不可用，请检查显卡驱动')
        return
      }
      if (!anime4kRenderer.ready) {
        showToast('Anime4K 着色器编译失败')
        return
      }

      anime4kEnabled = !anime4kEnabled
      localStorage.setItem('anime4kEnabled', anime4kEnabled.toString())

      if (anime4kEnabled) {
        anime4kRenderer.start()
        videoPlayer.classList.add('anime4k-active')
        showToast('Anime4K 画质增强已开启')
      } else {
        anime4kRenderer.stop()
        videoPlayer.classList.remove('anime4k-active')
        showToast('Anime4K 画质增强已关闭')
      }

      updateAnime4KMenu()
    })

    menuAudioAdjust.addEventListener('click', () => {
      showToast('视频音效调节功能开发中')
      contextMenu.classList.remove('show')
    })

    menuVideoStats.addEventListener('click', () => {
      showToast('视频统计信息功能开发中')
      contextMenu.classList.remove('show')
    })

    function showToast(message) {
      const toast = document.createElement('div')
      toast.style.cssText = `
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 10000;
        animation: toastFadeInUp 0.3s ease;
      `
      toast.textContent = message
      document.body.appendChild(toast)
      
      setTimeout(() => {
        toast.style.animation = 'toastFadeOutDown 0.3s ease'
        setTimeout(() => toast.remove(), 300)
      }, 2000)
    }

    function showShortcutsDialog() {
      const dialog = document.createElement('div')
      dialog.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(30, 30, 30, 0.85);
        border-radius: 12px;
        padding: 20px;
        min-width: 320px;
        max-width: 90vw;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        z-index: 10000;
        backdrop-filter: blur(10px);
      `

      // 标题栏容器
      const headerContainer = document.createElement('div')
      headerContainer.style.cssText = `
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      `

      const title = document.createElement('div')
      title.style.cssText = `
        font-size: 18px;
        font-weight: 600;
        color: #fff;
        text-align: center;
        flex: 1;
      `
      title.textContent = '快捷键说明'

      // 右上角关闭按钮
      const closeBtn = document.createElement('button')
      closeBtn.style.cssText = `
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        color: #999;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.2s;
        font-size: 20px;
        line-height: 1;
      `
      closeBtn.textContent = '×'
      closeBtn.onmouseenter = () => {
        closeBtn.style.background = 'rgba(255, 255, 255, 0.1)'
        closeBtn.style.color = '#fff'
      }
      closeBtn.onmouseleave = () => {
        closeBtn.style.background = 'transparent'
        closeBtn.style.color = '#999'
      }
      closeBtn.onclick = () => {
        document.body.removeChild(dialog)
        document.body.removeChild(overlay)
      }

      headerContainer.appendChild(title)
      headerContainer.appendChild(closeBtn)
      dialog.appendChild(headerContainer)

      const shortcuts = [
        { key: 'Space', desc: '播放/暂停' },
        { key: 'ArrowRight', desc: '快进 5秒' },
        { key: 'ArrowLeft', desc: '快退 5秒' },
        { key: 'ArrowUp', desc: '音量+' },
        { key: 'ArrowDown', desc: '音量-' },
        { key: '=', desc: '放大窗口' },
        { key: '-', desc: '缩小窗口' },
        { key: 'F / Enter', desc: '全屏/退出全屏' },
        { key: 'Q', desc: '关闭窗口' },
        { key: 'V', desc: '弹幕开关' },
        { key: '1', desc: 'Anime4K 画质增强开关' }
      ]

      shortcuts.forEach(item => {
        const row = document.createElement('div')
        row.style.cssText = `
          display: flex;
          justify-content: space-between;
          padding: 8px 12px;
          border-radius: 6px;
          transition: background 0.15s;
        `
        row.onmouseenter = () => row.style.background = 'rgba(255,255,255,0.1)'
        row.onmouseleave = () => row.style.background = 'transparent'

        const key = document.createElement('span')
        key.style.cssText = `
          background: rgba(255, 255, 255, 0.1);
          padding: 4px 10px;
          border-radius: 4px;
          font-family: monospace;
          font-size: 13px;
          color: #00a1d6;
        `
        key.textContent = item.key

        const desc = document.createElement('span')
        desc.style.cssText = `
          color: rgba(255, 255, 255, 0.8);
          font-size: 14px;
        `
        desc.textContent = item.desc

        row.appendChild(key)
        row.appendChild(desc)
        dialog.appendChild(row)
      })

      const overlay = document.createElement('div')
      overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: 9999;
      `
      overlay.onclick = () => {
        document.body.removeChild(dialog)
        document.body.removeChild(overlay)
      }

      document.body.appendChild(overlay)
      document.body.appendChild(dialog)
    }

    // 自动隐藏/显示控制栏
    const playerControls = document.querySelector('.player-controls')
    let hideTimer = null
    let isMouseInControlArea = false
    let hideVolumeTimer = null

    const showControls = () => {
      playerControls.classList.add('visible')
      if (hideTimer) {
        clearTimeout(hideTimer)
        hideTimer = null
      }
    }

    const hideControls = () => {
      if (!videoPlayer.paused && !isMouseInControlArea) {
        playerControls.classList.remove('visible')
      }
    }

    const scheduleHideControls = () => {
      if (hideTimer) {
        clearTimeout(hideTimer)
      }
      if (!videoPlayer.paused && !isMouseInControlArea) {
        hideTimer = setTimeout(hideControls, 2000)
      }
    }

    playerControls.addEventListener('mouseenter', () => {
      isMouseInControlArea = true
      if (hideTimer) {
        clearTimeout(hideTimer)
        hideTimer = null
      }
    })

    playerControls.addEventListener('mouseleave', () => {
      isMouseInControlArea = false
      scheduleHideControls()
    })

    document.addEventListener('mouseleave', () => {
      if (!videoPlayer.paused) {
        playerControls.classList.remove('visible')
        playerHeader.classList.remove('visible')
        hideCursor()
      }
    })

    // 顶部标题栏显示/隐藏 - 和底部控制栏一样的逻辑
    const playerHeader = document.querySelector('.player-header')
    let isMouseInHeaderArea = false

    const showHeader = () => {
      playerHeader.classList.add('visible')
    }

    const hideHeader = () => {
      if (!isMouseInHeaderArea) {
        playerHeader.classList.remove('visible')
      }
    }

    playerHeader.addEventListener('mouseenter', () => {
      isMouseInHeaderArea = true
    })

    playerHeader.addEventListener('mouseleave', () => {
      isMouseInHeaderArea = false
      hideHeader()
    })

    let cursorHideTimer = null
    const cursorHideDelay = 1000

    const getVideoPlayer = () => {
      return videoPlayer || document.querySelector('.video-player')
    }

    const isVideoPlaying = () => {
      const vp = getVideoPlayer()
      return vp && !vp.paused && !vp.ended
    }

    const showCursor = () => {
      document.documentElement.classList.remove('hide-cursor')
      if (cursorHideTimer) {
        clearTimeout(cursorHideTimer)
        cursorHideTimer = null
      }
    }

    const hideCursor = () => {
      if (isVideoPlaying()) {
        document.documentElement.classList.add('hide-cursor')
      }
    }

    const scheduleHideCursor = () => {
      if (cursorHideTimer) {
        clearTimeout(cursorHideTimer)
      }
      if (isVideoPlaying()) {
        cursorHideTimer = setTimeout(hideCursor, cursorHideDelay)
      } else {
        showCursor()
      }
    }

    document.addEventListener('mousemove', (e) => {
      showCursor()

      // 光标在侧边栏时不触发控制栏/标题栏显示
      const isOnPanel = e.target.closest('.video-info-panel')

      const windowHeight = window.innerHeight
      const bottomThreshold = windowHeight * 0.8
      const topThreshold = windowHeight * 0.2
      const isInVideoArea = e.clientY >= topThreshold && e.clientY <= bottomThreshold

      if (!isOnPanel) {
        if (e.clientY > bottomThreshold) {
          showControls()
        } else if (!isMouseInControlArea) {
          hideControls()
        }

        if (e.clientY < topThreshold) {
          showHeader()
        } else if (!isMouseInHeaderArea) {
          hideHeader()
        }
      }

      if (isInVideoArea && !videoPlayer.paused) {
        scheduleHideCursor()
      }

      // 鼠标移动时显示侧边栏切换按钮
      const videoInfoPanel = document.getElementById('videoInfoPanel')
      const isPanelVisible = videoInfoPanel?.classList.contains('visible')
      
      updatePanelToggleBtn(isPanelVisible)
      scheduleHidePanelToggleBtn()
    })

    let panelToggleHideTimer = null

    function scheduleHidePanelToggleBtn() {
      if (panelToggleHideTimer) {
        clearTimeout(panelToggleHideTimer)
      }
      panelToggleHideTimer = setTimeout(() => {
        const videoInfoPanel = document.getElementById('videoInfoPanel')
        if (!videoInfoPanel?.classList.contains('visible')) {
          panelToggleBtn.classList.remove('visible')
        }
      }, 1000)
    }

    // 更新侧边栏切换按钮的状态和位置
    function updatePanelToggleBtn(isPanelVisible) {
      // 移除之前的状态类
      panelToggleBtn.classList.remove('expand', 'collapse')
      
      if (isPanelVisible) {
        // 侧边栏展开时，显示收缩按钮在侧边栏左侧
        panelToggleBtn.classList.add('visible', 'collapse')
      } else {
        // 侧边栏收起时，显示展开按钮在右侧边缘
        panelToggleBtn.classList.add('visible', 'expand')
      }
    }

    // 侧边栏切换按钮点击事件
    panelToggleBtn.addEventListener('click', () => {
      const videoInfoPanel = document.getElementById('videoInfoPanel')
      const videoPlayer = document.querySelector('.video-player')
      if (videoInfoPanel && videoPlayer) {
        const isVisible = videoInfoPanel.classList.toggle('visible')
        videoPlayer.classList.toggle('with-panel', isVisible)
        
        // 更新按钮状态和位置
        updatePanelToggleBtn(isVisible)
      }
    })

    videoPlayer.addEventListener('pause', () => {
      showControls()
      showCursor()
      stopProgressReportTimer()
      stopDashSyncTimer()
      if (hideTimer) {
        clearTimeout(hideTimer)
        hideTimer = null
      }
    })

    videoPlayer.addEventListener('play', () => {
      hideControls()
      startProgressReportTimer()
      startDashSyncTimer()
      const videoArea = document.querySelector('.video-area')
      if (videoArea) {
        const rect = videoArea.getBoundingClientRect()
        scheduleHideCursor()
      }
    })

    // 按Q键关闭播放器，按F或回车键全屏，按-缩放窗口按=放大窗口
    let lastZoomTime = 0

    const processZoom = (delta) => {
      const now = Date.now()
      if (now - lastZoomTime < 100) return
      lastZoomTime = now
      ipcRenderer.invoke('zoom-player-window', delta)
    }

    let lastGKeyTime = 0

    document.addEventListener('keydown', (e) => {
      // gg: 回到顶部（侧边栏优先，否则主页面）
      if (e.key === 'g' || e.key === 'G') {
        if (e.ctrlKey || e.altKey || e.metaKey) return
        const now = Date.now()
        if (now - lastGKeyTime < 400) {
          e.preventDefault()
          const panel = document.getElementById('videoInfoPanel')
          if (panel && panel.classList.contains('visible') && panel.scrollTop > 0) {
            panel.scrollTo({ top: 0, behavior: 'smooth' })
          }
        }
        lastGKeyTime = now
        return
      }

      // e: 侧边栏向上翻半页
      if (e.key === 'e' && !e.ctrlKey && !e.altKey && !e.metaKey) {
        const panel = document.getElementById('videoInfoPanel')
        if (panel && panel.classList.contains('visible')) {
          e.preventDefault()
          panel.scrollBy({ top: -panel.clientHeight * 0.5, behavior: 'smooth' })
        }
        return
      }

      // d: 侧边栏向下翻半页
      if (e.key === 'd' && !e.ctrlKey && !e.altKey && !e.metaKey) {
        const panel = document.getElementById('videoInfoPanel')
        if (panel && panel.classList.contains('visible')) {
          e.preventDefault()
          panel.scrollBy({ top: panel.clientHeight * 0.5, behavior: 'smooth' })
        }
        return
      }

      if (e.key === 'q' || e.key === 'Q') {
        e.preventDefault()
        safeClosePlayer()
      }
      if (e.key === 'f' || e.key === 'F' || e.key === 'Enter') {
        ipcRenderer.invoke('toggle-fullscreen')
      }
      if (e.key === 'v' || e.key === 'V') {
        danmakuToggleBtn.click()
      }
      if (e.key === '-' || e.key === '=') {
        processZoom(e.key === '=' ? 1 : -1)
      }
      if (e.key === ' ') {
        e.preventDefault()
        if (videoPlayer.paused) {
          videoPlayer.play()
        } else {
          videoPlayer.pause()
        }
      }
      if (e.key === 'ArrowLeft') {
        e.preventDefault()
        showControls()
        videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 5)
        scheduleHideControls()
      }
      if (e.key === 'ArrowRight') {
        e.preventDefault()
        showControls()
        videoPlayer.currentTime = Math.min(videoPlayer.duration, videoPlayer.currentTime + 5)
        scheduleHideControls()
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault()
        videoPlayer.volume = Math.min(1, videoPlayer.volume + 0.1)
        updateVerticalVolumeDisplay()
        showVerticalVolumeBar()
        saveVolume(videoPlayer.volume)
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault()
        videoPlayer.volume = Math.max(0, videoPlayer.volume - 0.1)
        updateVerticalVolumeDisplay()
        showVerticalVolumeBar()
        saveVolume(videoPlayer.volume)
      }
      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault()
        videoPlayer.muted = !videoPlayer.muted
        if (videoPlayer.muted) {
          videoPlayer.volume = 0
        } else {
          const savedVol = localStorage.getItem('playerVolume')
          videoPlayer.volume = savedVol !== null ? parseFloat(savedVol) : 0.8
        }
        updateVerticalVolumeDisplay()
        showVerticalVolumeBar()
      }
      if (e.key === 'Tab') {
        e.preventDefault()
        if (e.ctrlKey) {
          ipcRenderer.invoke('move-to-next-display')
        } else {
          const videoInfoPanel = document.getElementById('videoInfoPanel')
          const videoPlayer = document.querySelector('.video-player')
          if (videoInfoPanel && videoPlayer) {
            const isVisible = videoInfoPanel.classList.toggle('visible')
            videoPlayer.classList.toggle('with-panel', isVisible)
            updatePanelToggleBtn(isVisible)
          }
        }
      }
      if (e.key === '1') {
        menuAnime4K.click()
      }
      if (e.key === 'F12') {
        e.preventDefault()
        ipcRenderer.invoke('open-player-dev-tools')
      }
      if (e.key === 'w' || e.key === 'W') {
        e.preventDefault()
        ipcRenderer.invoke('move-player-window', 'up')
      }
      if (e.key === 's' || e.key === 'S') {
        e.preventDefault()
        ipcRenderer.invoke('move-player-window', 'down')
      }
      if (e.key === 'a' || e.key === 'A') {
        e.preventDefault()
        ipcRenderer.invoke('move-player-window', 'left')
      }
      if (e.key === 'd' || e.key === 'D') {
        e.preventDefault()
        ipcRenderer.invoke('move-player-window', 'right')
      }
    })

    // 鼠标滚轮：直接滚动=音量，Ctrl+滚动=进度，Alt+滚动=窗口缩放
    document.addEventListener('wheel', (e) => {
      // 光标在侧边栏或收藏夹弹窗时不做音量/进度/缩放处理，让面板自然滚动
      if (e.target.closest('.video-info-panel, #favoritesModal')) return

      if (e.ctrlKey) {
        e.preventDefault()
        const delta = e.deltaY > 0 ? 5 : -5
        if (e.deltaY > 0) {
          videoPlayer.currentTime = Math.min(videoPlayer.duration || 0, videoPlayer.currentTime + 5)
        } else {
          videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 5)
        }
        showControls()
        scheduleHideControls()
      } else if (e.altKey) {
        e.preventDefault()
        ipcRenderer.invoke('zoom-player-window', e.deltaY > 0 ? -1 : 1)
      } else {
        e.preventDefault()
        const delta = e.deltaY > 0 ? -0.05 : 0.05
        videoPlayer.volume = Math.max(0, Math.min(1, videoPlayer.volume + delta))
        updateVerticalVolumeDisplay()
        showVerticalVolumeBar()
        saveVolume(videoPlayer.volume)
      }
    }, { passive: false })

    ipcRenderer.on('play-video-data', async (event, data) => {
      console.log('Received play-video-data:', data)
      currentVideoData = data
      videoTitle.textContent = data.title
      infoTitle.textContent = data.title
      
      // 确保信息面板初始状态是隐藏的
      const videoInfoPanel = document.getElementById('videoInfoPanel')
      const videoPlayer = document.querySelector('.video-player')
      if (videoInfoPanel) {
        videoInfoPanel.classList.remove('visible')
      }
      if (videoPlayer) {
        videoPlayer.classList.remove('with-panel')
      }
      
      if (data.cookies) {
        console.log('Cookies:', Object.keys(data.cookies))
      }

      if (data.episodeData && data.episodeData.episodes && data.episodeData.episodes.length > 0) {
        renderEpisodeList(data.episodeData)
      } else {
        panelSeason.style.display = 'none'
      }

      try {
        // 优先使用预加载的视频URL，否则 loadVideo 内部会自行请求
        await loadVideo(data.bvid, data.cid, data.progress, data.preFetchVideoUrl)

        // 视频信息：优先用预加载数据
        if (data.preFetchVideoInfo && data.preFetchVideoInfo.owner) {
          populateVideoInfo(data.preFetchVideoInfo, data.preFetchVideoInfo.related)
        } else {
          // 无预加载数据，不阻塞播放，异步加载
          loadVideoInfo(data.bvid)
        }

        // 弹幕也异步加载，不阻塞播放
        if (danmakuEnabled && data.cid) {
          loadDanmaku(data.cid)
        }
      } catch (error) {
        console.error('Error loading video:', error)
        showError('加载失败', error.message)
      }
    })

    // Receive late-arriving prefetch data from the main process.
    // If the video hasn't loaded yet, apply it to skip the get-video-url IPC.
    ipcRenderer.on('prefetch-data', (event, data) => {
      console.log('Received prefetch-data:', data)
      if (data.preFetchVideoUrl && pendingPrefetchData === null && videoPlayer.src === '') {
        pendingPrefetchData = data.preFetchVideoUrl
      }
      if (data.preFetchVideoInfo && data.preFetchVideoInfo.owner) {
        populateVideoInfo(data.preFetchVideoInfo, data.preFetchVideoInfo.related)
      }
    })

    function renderEpisodeList(episodeData) {
      currentEpisodeData = episodeData
      if (!panelSeason) return

      panelSeason.style.display = 'block'
      panelSeason.innerHTML = `
        <div class="panel-season-header">
          <div class="panel-season-info">

    async function loadVideo(bvid, cid, progress = null, preFetchResult = null) {
      console.log('Loading video, bvid:', bvid, 'cid:', cid, 'progress:', progress, 'preFetch:', !!preFetchResult)
      loadingOverlay.style.display = 'flex'
      errorOverlay.style.display = 'none'

      try {
        if (!cid) {
          throw new Error('缺少视频cid')
        }

        // 使用预加载数据，跳过IPC请求；没有则检查背景预加载是否已到达
        let result
        if (preFetchResult && preFetchResult.success) {
          console.log('Using pre-fetched video URL:', preFetchResult.quality)
          result = preFetchResult
        } else {
          // Give the background prefetch a brief window to arrive
          for (let i = 0; i < 10 && !pendingPrefetchData; i++) {
            await new Promise(r => setTimeout(r, 50))
          }
          if (pendingPrefetchData && pendingPrefetchData.success) {
            console.log('Using background prefetch data:', pendingPrefetchData.quality)
            result = pendingPrefetchData
            pendingPrefetchData = null
          } else {
            result = await ipcRenderer.invoke('get-video-url', bvid, cid)
            console.log('get-video-url result:', result)
          }
        }

        if (!result.success) {
          throw new Error(result.error || '获取视频地址失败')
        }

        console.log('Video URL:', result.url)
        console.log('Audio URL:', result.audioUrl)
        console.log('Is combined format:', result.isCombined)

        // 清理旧音频元素和 DASH 同步监听器
        if (currentAudioElement) {
          currentAudioElement.pause()
          currentAudioElement.remove()
          currentAudioElement = null
        }
        stopDashSyncTimer()
        videoPlayer.removeEventListener('play', dashSyncHandlers.onPlay)
        videoPlayer.removeEventListener('pause', dashSyncHandlers.onPause)
        videoPlayer.removeEventListener('volumechange', dashSyncHandlers.onVolumeChange)
        videoPlayer.removeEventListener('seeked', dashSyncHandlers.onSeeked)

        videoPlayer.crossOrigin = 'anonymous'
        videoPlayer.src = result.url

        // 应用保存的音量
        const savedVol = localStorage.getItem('playerVolume')
        if (savedVol !== null) {
          videoPlayer.volume = parseFloat(savedVol)
        }

        if (result.audioUrl && !result.isCombined) {
          console.log('Creating separate audio element for DASH format')
          currentAudioElement = document.createElement('audio')
          currentAudioElement.src = result.audioUrl
          currentAudioElement.crossOrigin = 'anonymous'

          if (savedVol !== null) {
            currentAudioElement.volume = parseFloat(savedVol)
          }

          videoPlayer.addEventListener('play', dashSyncHandlers.onPlay)
          videoPlayer.addEventListener('pause', dashSyncHandlers.onPause)
          videoPlayer.addEventListener('volumechange', dashSyncHandlers.onVolumeChange)
          videoPlayer.addEventListener('seeked', dashSyncHandlers.onSeeked)
        }

        videoPlayer.load()

        let hasLoaded = false
        let hasError = false
        let initialProgressSet = false

        videoPlayer.addEventListener('loadedmetadata', function onMeta() {
          console.log('Video metadata loaded')
          if (!hasLoaded && !hasError) {
            if (progress !== null && progress !== undefined && !initialProgressSet) {
              videoPlayer.currentTime = progress
              initialProgressSet = true
              console.log('Set initial progress to:', progress)
            }
            hasLoaded = true
            loadingOverlay.style.display = 'none'
            videoPlayer.play()
          }
        }, { once: true })

        videoPlayer.addEventListener('canplay', function onCanPlay() {
          console.log('Video can play')
          if (!hasLoaded && !hasError) {
            if (progress !== null && progress !== undefined && !initialProgressSet) {
              videoPlayer.currentTime = progress
              initialProgressSet = true
              console.log('Set initial progress to:', progress)
            }
            hasLoaded = true
            loadingOverlay.style.display = 'none'
            videoPlayer.play()
          }
        }, { once: true })

        videoPlayer.addEventListener('error', function onErr(e) {
          console.error('Video player error:', videoPlayer.error)
          console.error('Error code:', videoPlayer.error?.code)
          console.error('Error message:', videoPlayer.error?.message)
          if (!hasError) {
            hasError = true
            showError('播放失败', '无法加载视频资源 (code: ' + (videoPlayer.error?.code || 'unknown') + ')')
          }
        }, { once: true })

        // 清除上一次的超时定时器，避免干扰当前加载
        if (loadVideoTimeout) {
          clearTimeout(loadVideoTimeout)
          loadVideoTimeout = null
        }

        // 超时后显示错误并允许重试
        loadVideoTimeout = setTimeout(() => {
          if (!hasLoaded && !hasError) {
            console.log('Video loading timeout, showing error')
            hasError = true
            videoPlayer.removeAttribute('src')
            showError('加载超时', '视频加载时间过长，请检查网络后重试')
          }
          loadVideoTimeout = null
        }, 15000)
      } catch (error) {
        console.error('Error in loadVideo:', error)
        showError('加载失败', error.message)
      }
    }
