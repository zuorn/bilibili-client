[package]
name = "bilibili-client"
version = "0.1.0"
description = "Bilibili client"
authors = ["Zuorn"]
license = "ISC"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = true, features = ["gzip", "brotli", "json"] }
tokio = { version = "1", features = ["time", "macros", "process", "rt"] }
md-5 = "0.10"
percent-encoding = "2"
once_cell = "1"
chrono = "0.4"

# Windows：播放器窗口 CDN 请求头注入（WebView2 COM，与 wry 使用的版本保持一致）
[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows = "0.61"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
