name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # 仅当 website 目录或本工作流变动时才重新部署，避免无关提交浪费运行额度
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 允许工作流将内容部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只运行一个部署，新提交会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 部署 website 目录下的静态文件（index.html 等）
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
