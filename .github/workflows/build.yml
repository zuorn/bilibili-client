name: Build & Release

# 版本号唯一源头：根目录 VERSION 文件（一行纯文本版本号，如 0.2.0）。
#
# 触发条件：
#   1. push v* 标签      → 校验 tag 与 VERSION 一致后，三平台打包 + 发布 Release
#   2. push main/master  → 读取 VERSION：若 v<VERSION> 标签已存在则跳过；
#                          否则自动打标签 v<VERSION> 并发布 Release（推送即发版）
#   3. PR 到 main/master → 仅三平台打包验证
#   4. 手动触发          → 按 VERSION 发版（可选是否发布 Release）
#
# 注意：Release 发布需要仓库 Secrets（值均来自本地 env.json）：
#   TAURI_SIGNING_PRIVATE_KEY → env.json 的 tauri.signingPrivateKey（多行 Base64，原样完整粘贴）
#   TAURI_UPDATER_PUBKEY      → env.json 的 tauri.updaterPubkey
#   （私钥密码为空，CI 固定传空值；可用 node scripts/copy-ci-secret.js 复制私钥到剪贴板）
#   tauri.conf.json 不含公钥与版本号，CI 通过生成的 tauri.updater.conf.json 注入
on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      should_build: ${{ steps.prepare.outputs.should_build }}
      should_release: ${{ steps.prepare.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version & release decision
        id: prepare
        shell: bash
        run: |
          VERSION=$(tr -d ' \t\n\r' < VERSION)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "::error::VERSION 文件内容非法: '$VERSION'（应为 x.y.z 格式）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 标签触发：tag 必须与 VERSION 一致
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME, VERSION=$VERSION"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME 与 VERSION ($VERSION) 不一致，请修正后重新打标签"
              exit 1
            fi
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # PR：仅打包验证，不发布
            echo "should_build=true"   >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_build=true"   >> "$GITHUB_OUTPUT"
            echo "should_release=${{ github.event.inputs.create_release }}" >> "$GITHUB_OUTPUT"
          else
            # push main/master：v<VERSION> 标签已存在（该版本已发布）则跳过
            if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "refs/tags/v$VERSION"; then
              echo "v$VERSION 已发布，跳过本次构建"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "新版本 $VERSION，自动打标签并发布"
              echo "should_build=true"   >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest     # Windows x64
            args: '--bundles nsis --config src-tauri/tauri.updater.conf.json'
          - platform: macos-latest       # macOS Apple Silicon
            args: '--target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.conf.json'
          - platform: macos-13           # macOS Intel
            args: '--target x86_64-apple-darwin --bundles app,dmg --config src-tauri/tauri.updater.conf.json'
          - platform: ubuntu-22.04       # Linux x64
            args: '--bundles appimage --config src-tauri/tauri.updater.conf.json'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux 打包需要系统依赖
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || (matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '') }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 生成注入配置：版本号（来自 VERSION）+ 公钥（来自 Secret）
      # tauri.conf.json 不含版本号与公钥，通过 JSON merge patch 合并注入
      - name: Write version & updater pubkey config
        shell: bash
        run: |
          cat > src-tauri/tauri.updater.conf.json <<EOF
          { "version": "${{ needs.prepare.outputs.version }}", "plugins": { "updater": { "pubkey": "${TAURI_UPDATER_PUBKEY}" } } }
          EOF
          cat src-tauri/tauri.updater.conf.json
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}

      # 校验签名私钥：Secret 名为 TAURI_SIGNING_PRIVATE_KEY
      # 正确值 = env.json 的 tauri.signingPrivateKey（单行 Base64，本地构建签名同源）
      # 校验方式与 tauri 一致：base64 解码后应出现 minisign 私钥的 untrusted comment 头
      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::缺少 Secret TAURI_SIGNING_PRIVATE_KEY（正确值 = env.json 的 tauri.signingPrivateKey，可运行 node scripts/copy-ci-secret.js 复制）"
            exit 1
          fi
          CLEANED=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d ' \t\n\r')
          if printf '%s' "$CLEANED" | base64 -d 2>/dev/null | head -c 60 | grep -q "untrusted comment"; then
            echo "签名私钥格式校验通过"
          else
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 不是有效的 tauri 私钥（base64 解码后缺少 untrusted comment 头）。请运行 node scripts/copy-ci-secret.js 重新复制正确值并更新 Secret"
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 私钥未加密（env.json 中密码为空），固定空值避免误配导致解密失败
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # release 构建开启前端 js/css 压缩（beforeBuildCommand 的 build-frontend.js 使用）
          FRONTEND_MINIFY: '1'
        with:
          # 版本号唯一源头是 VERSION 文件；标签不存在时 tauri-action 会自动创建
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: 'Bilibili Client v${{ needs.prepare.outputs.version }}'
          releaseBody: '## Downloads\n\n- Windows: `Bilibili-Client_*_x64-setup.exe`\n- macOS (Apple Silicon): `Bilibili-Client_*_aarch64.app.tar.gz` / `*_aarch64.dmg`\n- macOS (Intel): `Bilibili-Client_*_x64.app.tar.gz` / `*_x64.dmg`\n- Linux: `Bilibili-Client_*_amd64.AppImage`'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # GitHub Actions 表达式没有 concat 函数，用 format 拼接 --no-bundle
          args: ${{ needs.prepare.outputs.should_release == 'true' && matrix.args || format('{0} --no-bundle', matrix.args) }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-client-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/nsis/*.sig
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/bundle/macos/*.dmg
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/appimage/*.AppImage.sig
            src-tauri/target/**/bundle/latest.json
          retention-days: 7
          if-no-files-found: ignore
