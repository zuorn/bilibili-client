name: Build & Release

# 触发条件：
#   1. push v* 标签      → Windows 打包 + 自动发布 Release（含 tauri updater 的 latest.json）
#   2. PR 到 main/master → 仅打包验证
#   3. 手动触发          → 可选是否发布 Release
#
# 注意：Release 发布需要仓库 Secrets 中配置 TAURI_SIGNING_PRIVATE_KEY（值来自本地 env.json
# 的 tauri.signingPrivateKey，可选 TAURI_SIGNING_PRIVATE_KEY_PASSWORD）。
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tagName / releaseName 仅在发布时使用；不发布时只产出构建产物
          tagName: ${{ github.ref_name }}
          releaseName: 'Bilibili Client ${{ github.ref_name }}'
          releaseBody: '## Downloads\n\n- Windows: `Bilibili-Client_*_x64-setup.exe`'
          releaseDraft: false
          prerelease: false
          # 仅在 push tag 或手动触发且 create_release=true 时发布 Release
          includeUpdaterJson: true
          args: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')) && '' || '--no-bundle' }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          retention-days: 7
          if-no-files-found: ignore
